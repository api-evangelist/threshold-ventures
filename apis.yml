aid: threshold-ventures
name: Threshold Ventures
description: >-
  Threshold Ventures is an early-stage venture capital firm based in Menlo Park,
  California that backs founder-led technology companies at the threshold of
  breakout growth. Threshold is the 2019 rebrand of Draper Fisher Jurvetson
  (DFJ), the storied Sand Hill Road firm founded in 1985; managing partners Emily
  Melton and Josh Stein spun the venture practice into an independent, focused
  fund. Threshold pursues a high-conviction strategy, concentrating on a small
  number of Series A and Series B investments and partnering hands-on with
  founders for the long term, frequently holding board seats through IPO and
  beyond. The firm invests across enterprise software and SaaS, developer tools
  and infrastructure, fintech, digital health and healthcare, and AI. Its
  portfolio has produced 10 unicorns, 3 IPOs, and 17 acquisitions, and includes
  Box, Twilio, Redfin, Remitly, Doximity, Rippling, LaunchDarkly, Livongo, and
  Talkdesk. Threshold has invested in roughly 87 companies and raised a ~$250M
  fund following the rebrand.
